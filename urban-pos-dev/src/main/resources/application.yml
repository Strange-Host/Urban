spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migrations
    ignore-missing-migrations: true
    repair-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false



jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

webhook:
  wpforms:
    secret: ${WPFORMS_WEBHOOK_SECRET:}

shopify:
  webhook:
    secret: ${SHOPIFY_WEBHOOK_SECRET:}

zettatel:
  api-key: ${ZETTATEL_API_KEY:}
  user-id: ${ZETTATEL_USER:}
  password: ${ZETTATEL_PASS:}
  sender-id: KamkunjiHub

kcb:
  consumer-key: ${KCB_CONSUMER_KEY:}
  consumer-secret: ${KCB_CONSUMER_SECRET:}
  base-url: ${KCB_BASE_URL:https://uat.buni.kcbgroup.com}
  ipn:
    secret: ${KCB_IPN_SECRET:}

seed:
  admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
    phone: ${SEED_ADMIN_PHONE:}

server:
  port: 8080
