spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migrations
    ignore-missing-migrations: true
    repair-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false



